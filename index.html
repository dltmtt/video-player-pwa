<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <meta
    name="description"
    content="Player for local videos with keyboard shortcuts."
  />
  <meta name="color-scheme" content="light dark" />

  <title>Player for local videos</title>

  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" sizes="any" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@275,0..1&family=JetBrains+Mono"
    rel="stylesheet"
  />
  <link rel="manifest" href="app.webmanifest" />

  <script src="scripts/script.js" defer></script>

  <div class="droppable" id="drag-panel">
    <span id="message">Drag and drop a video</span>
    <button type="button" id="file-picker">Choose file</button>
  </div>
  <div id="drop-overlay" hidden></div>

  <div class="droppable" id="player" hidden>
    <video id="video"></video>

    <div id="controls" aria-controls="video">
      <input
        type="range"
        aria-label="Video bar"
        value="0"
        step="any"
        tabindex="-1"
        id="video-bar"
      />

      <button
        type="button"
        aria-label="Rewind 10 seconds"
        class="material-symbols-rounded"
        id="replay-btn"
        title="Rewind 10 seconds (Z)"
      >
        replay_10
      </button>
      <button
        type="button"
        aria-label="Toggle play/pause"
        class="material-symbols-rounded"
        id="play-btn"
        tabindex="0"
        title="Play/pause (Space)"
      >
        play_arrow
      </button>
      <button
        type="button"
        aria-label="Forward 10 seconds"
        class="material-symbols-rounded"
        id="forward-btn"
        title="Forward 10 seconds (X)"
      >
        forward_10
      </button>

      <button
        type="button"
        aria-label="Toggle time indicator"
        id="time-indicator-toggle"
        data-state="default"
        title="Toggle remaining / elapsed time (T)"
      >
        <time role="timer" id="time-indicator">00:00</time>
        <time role="timer" id="duration-or-finish-at"></time>
      </button>
      <div id="file-name-container">
        <span id="file-name"></span>
      </div>

      <input
        type="number"
        aria-label="Speed controls"
        value="1.00"
        min="0.1"
        max="16"
        step="0.1"
        id="speed-controls"
      />
      <button
        type="button"
        aria-label="Load subtitles"
        class="material-symbols-rounded"
        id="subtitles-btn"
        title="Load subtitles (V)"
      >
        subtitles_off
      </button>
      <button
        type="button"
        aria-label="Toggle zoom"
        class="material-symbols-rounded"
        id="zoom-btn"
        title="Toggle zoom (C)"
      >
        zoom_out_map
      </button>
      <button
        type="button"
        aria-label="Toggle fullscreen"
        class="material-symbols-rounded"
        id="fullscreen-btn"
        title="Toggle fullscreen (F)"
      >
        fullscreen
      </button>
    </div>
    <input type="file" id="subtitle-picker" accept=".vtt,.srt" hidden />
  </div>
</html>
